[databases]
${DB_NAME} = host=${DB_HOST} port=${DB_PORT}

[pgbouncer]
listen_port = 6432
listen_addr = 0.0.0.0
# Postgres 15 usa scram-sha-256 por defecto: el userlist guarda el password
# en claro (generado desde env) y pgbouncer responde SCRAM al servidor.
# Cliente (PHP/libpq) también negocia SCRAM hacia pgbouncer.
auth_type = scram-sha-256
# PHP PDO envía `options` en el startup packet — pgbouncer debe ignorarlo.
ignore_startup_parameters = extra_float_digits,options
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
server_reset_query = DISCARD ALL
max_client_conn = 1000
default_pool_size = 50
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 600
server_lifetime = 3600
server_connect_timeout = 15
query_timeout = 30000
query_wait_timeout = 5
client_idle_timeout = 0
client_login_timeout = 60
stats_period = 60
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
