      <stop offset="100%" stop-color="#0a0f0d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87"/>
