name: NEXO CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-edge-cpp:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Install C++ Deps
      run: sudo apt-get install -y cmake libssl-dev libcurl4-openssl-dev libsqlite3-dev libspdlog-dev libmosquitto-dev
    - name: Build C++ Edge
      run: |
        cd backend/edge
        cmake --preset dev-x86
        cmake --build --preset dev-x86
    - name: Run Edge Tests
      run: cd backend/edge && ctest --preset dev-x86 --output-on-failure

  build-webapp-react:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: WebApp/package-lock.json
    - name: Install dependencies
      run: cd WebApp && npm ci
    - name: Lint WebApp
      run: cd WebApp && npm run lint
    - name: Build Vite
      run: cd WebApp && npm run build

  test-backend-php:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
    - name: PHP Syntax Lint
      run: find backend/api -name "*.php" -print0 | xargs -0 -n1 php -l
    - name: Run PHP Tests
      run: cd backend/api && php tests/PanicButtonTest.php

  build-landing:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: landing/package-lock.json
    - name: Install dependencies
      run: cd landing && npm ci
    - name: Build Landing
      run: cd landing && npm run build

  deploy-backend-railway:
    needs: [build-webapp-react, test-backend-php, build-edge-cpp, build-landing]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Railway CLI
      run: npm i -g @railway/cli
    - name: Deploy to Railway
      run: railway up --detach
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
