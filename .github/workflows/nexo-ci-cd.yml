name: NEXO CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-edge-cpp:
    runs-on: ubuntu-22.04
    # El edge C++ es firmware embebido — su fallo no debe bloquear el deploy web/backend
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - name: Install C++ Deps
      run: sudo apt-get install -y cmake libssl-dev libcurl4-openssl-dev libsqlite3-dev
    - name: Build C++ Edge
      run: |
        cd "Logica de negocio/edge"
        cmake --preset dev-x86
        cmake --build --preset dev-x86
    - name: Run Edge Tests
      run: cd "Logica de negocio/edge" && ctest --preset dev-x86 --output-on-failure

  build-webapp-react:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: WebApp/package-lock.json
    - name: Install dependencies
      run: cd WebApp && npm ci
    - name: Build Vite
      run: cd WebApp && npm run build

  deploy-backend-railway:
    # Solo depende del build de webapp — el edge C++ es independiente
    needs: [build-webapp-react]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Railway CLI
      run: npm i -g @railway/cli
    - name: Deploy to Railway
      run: railway up --detach
      env:
        RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
