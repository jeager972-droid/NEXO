name: NEXO CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-webapp-react:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: PWA/package-lock.json
    - name: Install dependencies
      run: cd PWA && npm ci
    - name: Lint PWA
      run: cd PWA && npm run lint
    - name: Build Vite
      run: cd PWA && npm run build
    - name: Run Vitest
      run: cd PWA && npx vitest run

  test-backend-php:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo, pdo_pgsql, redis, mbstring, json
    - name: Install Composer Dependencies
      run: cd backend/api && composer install --no-interaction --prefer-dist
    - name: PHP Syntax Lint
      run: find backend/api -name "*.php" -print0 | xargs -0 -n1 php -l
    - name: Run PHPUnit Tests
      run: cd test && ../backend/api/vendor/bin/phpunit --configuration phpunit.xml --testsuite "API Unit Tests"
    - name: Run SQL Schema Tests
      run: cd test && ../backend/api/vendor/bin/phpunit --configuration phpunit.xml --testsuite "SQL Schema Tests"
    - name: Run Custom Runner Tests
      run: |
        php test/runners/PlanComplianceTest.php
        php test/runners/SchemaPhpAlignmentTest.php
        php test/runners/FullSystemAlignmentTest.php
        php test/runners/PanicButtonTest.php

  build-landing:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: landing/package-lock.json
    - name: Install dependencies
      run: cd landing && npm ci
    - name: Build Landing
      run: cd landing && npm run build
