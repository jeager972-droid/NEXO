<!--
  WebApp entry HTML / NEXO Institucional
  Responsabilidad: Punto de entrada HTML para la SPA. Define PWA (manifest, icons,
  theme-color), SEO/OpenGraph, Content-Security-Policy y el contenedor #root.
  Dependencias: Vite inyecta /src/main.jsx como módulo. Assets estáticos en public/.
  Nota: El basename de la app es /app/; desplegado como PWA standalone.
-->
<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#003366" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NEXO" />
    <meta name="format-detection" content="telephone=no" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; base-uri 'self'; object-src 'none';" />

    <!-- Stage 9: SEO Meta Tags -->
    <meta name="description" content="NEXO: Plataforma EdTech IoT con soberanía educativa digital. Infraestructura híbrida con audit chain inmutable, certificación IP66 y corresponsabilidad familiar en tiempo real." />
    <meta name="keywords" content="NEXO, EdTech, IoT, educación digital, soberanía tecnológica, seguridad, certificación IP66, corresponsabilidad familiar" />
    <meta name="author" content="NEXO" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nexo.educ/" />
    <meta property="og:title" content="NEXO: Soberanía Educativa Digital" />
    <meta property="og:description" content="Plataforma EdTech IoT con seguridad de grado militar y corresponsabilidad familiar en tiempo real." />
    <meta property="og:image" content="/logo/logo_nexo.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://nexo.educ/" />
    <meta property="twitter:title" content="NEXO: Soberanía Educativa Digital" />
    <meta property="twitter:description" content="Plataforma EdTech IoT con seguridad de grado militar y corresponsabilidad familiar en tiempo real." />
    <meta property="twitter:image" content="/logo/logo_nexo.png" />

    <!-- WhatsApp-specific optimization -->
    <meta property="og:site_name" content="NEXO" />
    <meta property="og:locale" content="es_ES" />

    <title>NEXO: Soberanía Educativa Digital</title>
  </head>
  <body>
    <!-- Stage 9: Skip link for accessibility -->
    <a href="#main-content" style="position:absolute; left:-9999px; top:auto; width:1px; height:1px; overflow:hidden;">
      Saltar al contenido principal
    </a>
    <div id="root" role="main" id="main-content"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
