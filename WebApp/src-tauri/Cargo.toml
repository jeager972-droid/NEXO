[package]
name = "nexo"
version = "1.0.0"
description = "NEXO Institucional"
authors = ["NEXO Team"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

[lib]
name = "nexo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nexo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[dependencies]
tauri = { version = "2.0.0-rc", features = [] }
tauri-plugin-store = "2.0.0-rc"
tauri-plugin-biometric = "2.0.0-rc"
tauri-plugin-deep-link = "2.0.0-rc"
