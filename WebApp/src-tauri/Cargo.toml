[package]
name = "nexo"
version = "1.0.0"
description = "NEXO Institucional"
authors = ["NEXO Team"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

[lib]
name = "nexo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "nexo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-biometric = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-http = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
